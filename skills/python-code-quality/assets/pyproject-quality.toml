# Merge these sections into your pyproject.toml

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "FAST",
  "SIM", "C4", "RET", "PTH", "RUF", "PL", "TID", "T20", "ERA", "DTZ", "PT",
]
ignore = [
  "PLR0913",  # too many arguments (FastAPI routes legitimately take many deps)
  "B008",     # function call in default arg (FastAPI Depends/Query pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
